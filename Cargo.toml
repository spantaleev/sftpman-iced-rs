[package]
name = "sftpman-iced"
description = "A GUI frontend to sftpman (an application for managing and mounting sshfs (SFTP) filesystems)"
authors = ["Slavi Pantaleev <slavi@devture.com>"]
homepage = "https://github.com/spantaleev/sftpman-iced-rs"
repository = "https://github.com/spantaleev/sftpman-iced-rs"
license = "AGPL-3.0-or-later"
readme = "README.md"
keywords = ["sftp", "sshfs", "fuse"]
categories = ["gui", "network-programming", "filesystem"]
include = [
  "/assets/bootstrap",
  "/assets/sftpman-iced-512.png",
  "/assets/sftpman-iced.svg",
  "/src",
  "/locales",
  "/README.md",
  "/CHANGELOG.md",
  "/LICENSE"
]
version = "2.3.0"
edition = "2024"

[dependencies]
env_logger = { version = "0.11.*" }
# We can make wgpu optional and allow the tiny-skia renderer to be used,
# but we've found main list scrolling performance to be horrible on tiny-skia,
# so we're hardcoding wgpu here.
iced = { version = "0.14.*", default-features = false, features = ["tokio", "wgpu"] }
log = "0.4.*"
# For rfd, we rely on xdg-portal (which talks to the desktop portal over DBus).
# The alternative is the gtk3 feature, but that one links to gtk3 - we'd rather be independent.
rfd = { version = "0.17.*",  default-features = false, features = ["xdg-portal"], optional = true }
rust-i18n = "4.2.1"
sftpman = { version = ">=2.1.0", default-features = false }

[features]
default = ["file-picker", "icons", "system-theme-detection", "wayland", "x11"]
file-picker = ["dep:rfd"]
icons = ["iced/svg"]
# Makes the application follow the desktop's light/dark color-scheme preference,
# as exposed by the XDG desktop portal (`org.freedesktop.appearance` / `color-scheme`).
#
# This pulls in a DBus client stack (zbus and friends), which grows the release binary by ~1.8MB.
# Builds that would rather not pay for this can disable the feature - the theme can then still
# be chosen explicitly via the `ICED_THEME` environment variable.
system-theme-detection = ["iced/linux-theme-detection"]
wayland = ["iced/wayland"]
x11 = ["iced/x11"]
x11-icon = ["iced/image"]

[profile.release]
strip = true
opt-level = "z"
lto = "thin"
